name: Nanoce CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-resource-contract:
    name: Launcher resource contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate launcher resources
        run: python3 scripts/verify_launcher_resources.py

  native-tests:
    name: Native core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNANOCE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  android-apk:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run parser lifecycle unit tests
        run: gradle :app:testDebugUnitTest -PnanoceAbi=${{ matrix.abi }}

      - name: Build debug APK
        run: gradle :app:assembleDebug -PnanoceAbi=${{ matrix.abi }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nanoce-debug-${{ matrix.abi }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-snapshot-recovery:
    name: Android snapshot recovery tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run snapshot recovery instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 1200
          script: |
            gradle :app:connectedDebugAndroidTest -PnanoceAbi=x86_64 "-Pandroid.testInstrumentationRunnerArguments.class=com.waizusora.nanoce.SessionSnapshotRecoveryTest"
            gradle :app:connectedDebugAndroidTest -PnanoceAbi=x86_64 "-Pandroid.testInstrumentationRunnerArguments.class=com.waizusora.nanoce.ActivityRecreationTest"
            gradle :app:connectedDebugAndroidTest -PnanoceAbi=x86_64 "-Pandroid.testInstrumentationRunnerArguments.class=com.waizusora.nanoce.ProcessDeathSeedTest"
            adb shell am force-stop com.waizusora.nanoce.debug
            test -z "$(adb shell pidof com.waizusora.nanoce.debug)" || { echo "Process remained alive after force-stop" >&2; exit 1; }
            gradle :app:connectedDebugAndroidTest -PnanoceAbi=x86_64 "-Pandroid.testInstrumentationRunnerArguments.class=com.waizusora.nanoce.ProcessDeathRecoveryTest"
